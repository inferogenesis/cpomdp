[project]
name = "cpomdp"
version = "0.5.0"
description = "Continuous active inference for Python — the continuous-state sibling of pymdp."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Inferogenesis" }]
maintainers = [{ name = "Inferogenesis", email = "hello@inferogenesis.com" }]
keywords = ["active-inference", "pomdp", "kalman", "bayesian", "control"]
classifiers = [
    # No "License ::" classifier: PEP 639 forbids pairing it with the SPDX
    # `license` expression above, and PyPI rejects the upload if both appear.
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "jax>=0.4",
    "jaxtyping>=0.3.7",
    "numpy>=1.24",
    # The warrant vocabulary, published separately and developed in this repository
    # under `packages/warrantlib`. Stdlib-only, so it adds nothing to the install.
    # Capped below 0.4 because its minor versions break before 1.0, as cpomdp's do.
    "warrantlib>=0.3,<0.4",
]

[project.urls]
Homepage = "https://github.com/inferogenesis/cpomdp"
Repository = "https://github.com/inferogenesis/cpomdp"
Documentation = "https://cpomdp.inferogenesis.com/"

[project.optional-dependencies]
# The RxInfer (Julia) backend. Optional so the pure-Python parts install without Julia.
# juliapkg is named because the backend declares RxInfer to it on first use (ADR-071).
rxinfer = ["juliacall>=0.9.20", "juliapkg>=0.1.8"]
# Plotting deps for the `examples/` scripts (the README figure + the gallery). Kept
# out of the core install — `pip install "cpomdp[examples]"` to reproduce the figures.
# The example *scripts* are not shipped in the wheel (only `src/cpomdp` is); this just
# provides the libraries they import.
examples = ["matplotlib>=3.5", "pillow>=9"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "ty>=0.0.1a1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.8.0",
    # Validates warrantlib's shipped report schema against the records it writes.
    # A test-only dependency: warrantlib itself stays on the standard library.
    "jsonschema>=4.0",
    "pre-commit>=4.0",
    # The check suites, and with them scipy and sympy. Declared here rather than left to
    # `uv sync --all-packages`, so a plain `uv sync` or `uv run` cannot produce an
    # environment where `python -m research.checks.X` fails to import.
    "cpomdp-research",
]
# Documentation site (MkDocs + Material + mkdocstrings). API pages are generated
# from the Google-style docstrings. Build with `uv run --group docs mkdocs serve`.
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-bibtex>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpomdp"]

# cpomdp is the workspace root as well as a member. `warrantlib` publishes alongside it;
# `cpomdp-research` never publishes. One `uv.lock` and one `.venv`, both here.
[tool.uv.workspace]
members = ["packages/warrantlib", "research"]

# Resolved from the tree while developing. `uv build` strips these, so the published
# wheel carries a plain `Requires-Dist: warrantlib<0.4,>=0.3`.
[tool.uv.sources]
warrantlib = { workspace = true }
cpomdp-research = { workspace = true }

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests", "packages/warrantlib/src", "research/src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PT",   # flake8-pytest-style
    "PIE",  # flake8-pie
    "ICN",  # flake8-import-conventions (e.g. `import numpy as np`)
    "TID",  # flake8-tidy-imports
    "PERF", # perflint
    "NPY",  # numpy-specific rules
    "RUF",  # ruff-specific rules
    "D",    # pydocstyle — require docstrings on the public API (see per-file-ignores)
]
ignore = [
    # The docstrings and comments use real mathematical notation (−, ×, ∞, Aᵀ).
    # These rules flag those glyphs as "ambiguous" unicode; here they're deliberate
    # and correct, so the warning is just noise.
    "RUF001",
    "RUF002",
    "RUF003",
    # Constructors are documented at the class level (the Args sections live in the
    # class docstrings), so an extra __init__ docstring would just duplicate them.
    "D107",
    # jaxtyping shape strings (Float64[Array, "n n"]) read as forward annotations to
    # pyflakes/pyupgrade: they can't parse the axes (F722), read a single axis as an
    # undefined name (F821), or want to strip the "quotes" (UP037, which would break
    # the shape). All false positives; ty catches genuine undefined-name errors.
    "F722",
    "F821",
    "UP037",
]
# Deliberately not enabled: PL* — magic-value / arg-count / lazy-import warnings all
# fire on legitimate numerical code and the intentional lazy Julia import.

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"jax.numpy" = "jnp"

[tool.ruff.lint.per-file-ignores]
# Tests document themselves by name; don't require docstrings on them.
"tests/**" = ["D"]
# The ffg demos sit a directory below `examples/gallery.py`, so each extends sys.path
# before importing it. That statement has to come before the import, which is E402 by
# construction. `conftest.py` does the same job for the test process.
"examples/ffg/*" = ["E402"]

[tool.ty.environment]
python-version = "3.11"
extra-paths = ["examples", "examples/ffg", "tests"]

[tool.ty.src]
include = [
    "src",
    "tests",
    "examples",
    "mkdocs_hooks.py",
    "protected_files.py",
    "packages/warrantlib/src",
    "research/src",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# warrantlib's plugin turns every check this manifest declares into an item, so a check
# dropped from a suite fails by name instead of shrinking a count nobody is obliged to
# notice. Deliberately not in `testpaths`: the symbolic suites cost minutes since the
# sextic landed and have always run in their own CI job. Run them with
# `pytest research/registered_checks.toml`.
warrant_manifest = "research/registered_checks.toml"
addopts = "-ra"
markers = [
    "rxinfer: tests that require the RxInfer/Julia backend (deselect with '-m \"not rxinfer\"')",
    "slow: any test whose call time exceeds SLOW_TEST_SECONDS in conftest.py, currently 20s (deselect with '-m \"not slow\"'); run on merge-to-main and release, not on PRs. conftest reports unmarked tests over the threshold at the end of a run",
]
