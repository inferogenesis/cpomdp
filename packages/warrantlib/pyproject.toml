[project]
name = "warrantlib"
version = "0.4.0"
description = "A vocabulary for how well a claim is warranted, kept separate from whether it held."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Inferogenesis" }]
maintainers = [{ name = "Inferogenesis", email = "hello@inferogenesis.com" }]
keywords = ["evidence", "provenance", "reproducibility", "falsification"]
classifiers = [
    # No "License ::" classifier: PEP 639 forbids pairing it with the SPDX
    # `license` expression above, and PyPI rejects the upload if both appear.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
# Empty on purpose.
dependencies = []

# The pytest plugin, which is the only part of this distribution that imports anything
# outside the standard library. Optional, so `pip install warrantlib` is unchanged, and
# `import warrantlib` still pulls in no pytest: the plugin module is reached through the
# entry point below and never from `__init__`.
[project.optional-dependencies]
pytest = ["pytest>=8"]

# pytest reads this group from every installed distribution, so the plugin is active
# wherever both are present and needs no `-p` flag. Nothing reads it when pytest is
# absent, because there is no pytest to do the reading.
[project.entry-points.pytest11]
warrant = "warrantlib.pytest_plugin"

[project.urls]
Homepage = "https://github.com/inferogenesis/cpomdp"
Repository = "https://github.com/inferogenesis/cpomdp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warrantlib"]
