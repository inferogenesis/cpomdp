name: claude review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: claude review
    # Forks don't get the secret, so the action would fail auth validation. Dependabot
    # runs see only Dependabot secrets, so they fail it the same way.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.head.repo.fork == false
      && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: the review reads `git log` and diffs against its base,
          # and on a stacked PR that base is another branch a shallow clone has
          # never fetched. The repo is ~24 MB, so this costs seconds.
          fetch-depth: 0
      # A dispatched run carries no pull_request payload, so its number is looked up.
      # The action skips a run whose copy of this file differs from the default
      # branch's, and then there is nothing to post either.
      - name: find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "number=${NUMBER:-$(gh pr view "$GITHUB_REF_NAME" --json number -q .number)}" >> "$GITHUB_OUTPUT"
          if git diff --quiet "origin/$DEFAULT_BRANCH" HEAD -- .github/workflows/claude-review.yml; then
            echo "reviewable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::this run's review workflow differs from $DEFAULT_BRANCH's, so the action skips it"
            echo "reviewable=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: anthropics/claude-code-action@v1
        if: ${{ steps.pr.outputs.reviewable == 'true' }}
        # A failed review shows red. It gates nothing: `main` has no required
        # status checks, and this job is skipped outright on forks (see `if`
        # above), so a contributor without the secret never sees a failure.
        # Silent success was worse. Four reviews died on the turn budget and
        # reported green.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The weekly upkeep run opens its PRs as the Claude app. The action turns bot
          # actors away unless listed, so without this those PRs get no review.
          allowed_bots: "claude[bot]"
          # Logs each tool call and denial, so a review that posts nothing shows why.
          show_full_output: true
          prompt: |
            Review PR #${{ steps.pr.outputs.number }} against its merge base.

            Report every issue you find. Do not filter by severity while
            searching, and tag each finding [BLOCKER] or [NIT]. A severity
            floor applied during the search reads as an instruction to look
            less hard. Filter at output instead.

            A [BLOCKER] is anything that gives a silent wrong result, refuses
            valid input, has a side effect at install or at run time the
            caller did not ask for, or fixes a public-API shape that is costly
            to change after release. It is a blocker however rare the input
            that reaches it. A [NIT] changes no behaviour: wording, a stale
            comment, a leftover name in prose.

            Every finding cites path:line and the concrete call or input that
            goes wrong. If you cannot give both, drop it.

            Renames are the failure mode this repo actually hits. Check that no
            call site, docstring, error message or docs example is left on the
            old name.

            Check any item a present `BUILD_PLAN.md` claims this PR closes
            against the diff. Say so if the file is absent.

            Don't report formatting, naming style, import order or type-checker
            output. Lint and `ty` own those.

            Write one comment: a tally line, blockers in full, nits as
            one-liners capped at five with "plus K similar". Lead with "no
            blockers" when there are none. Don't summarise what the PR does,
            the author knows. Add no attribution footer and no links off this
            repository. Write it to review.md at the repository root with the
            Write tool. The workflow posts that file to the PR, so don't post
            it yourself.
          # Read/Grep/Glob let the review read surrounding code beyond the
          # diff hunks. The read-only git and shell forms are here because a
          # blocked call still costs a turn. Reviews were spending 9 to 18 of
          # their 40 turns on denials, dying before they could post.
          # Write is for the comment file only, which the next step posts. The
          # model posting it itself failed twice: on #143 it could not write
          # outside the checkout, and on #151 it was never told the PR number.
          # Opus on the first review, which does the heavy lifting over the whole
          # diff; Sonnet on each later push. A manual re-run of the job replays
          # the original event, so a re-run of the opening review is an Opus one.
          # 40 turns was not enough: with denials cut from 18 to 7 the reviews
          # still ran out mid-diff and posted nothing.
          claude_args: >-
            --model ${{ (github.event.action == 'opened' || github.event_name ==
            'workflow_dispatch') && 'claude-opus-5-5' || 'claude-sonnet-5-5' }}
            --max-turns 120 --allowed-tools
            "Read,Write,Grep,Glob,Bash(git
            diff:*),Bash(git log:*),Bash(git show:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(gh
            pr diff:*),Bash(gh pr view:*)"
      # Red when the review wrote nothing, which is how a run that died on its
      # turn budget or a denial shows instead of passing green.
      - name: post the review
        if: ${{ !cancelled() && steps.pr.outputs.reviewable == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          if [ ! -s review.md ]; then
            echo "::error::the review wrote no review.md"
            exit 1
          fi
          gh pr comment "$NUMBER" --body-file review.md
