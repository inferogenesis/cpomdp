name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let the workflow publish to GitHub Pages. One-time repo setup:
# Settings -> Pages -> Source = "GitHub Actions".
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAX_COMPILATION_CACHE_DIR: ${{ github.workspace }}/.jax-cache
      JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --group docs
      # Same key family as ci.yml's py3.12 test job, so this run starts from the
      # PR runs' compilations and its slow-test compiles feed back into them.
      - name: jax compilation cache
        uses: actions/cache@v6
        with:
          path: .jax-cache
          key: jax-cache-${{ runner.os }}-py3.12-${{ github.run_id }}
          restore-keys: jax-cache-${{ runner.os }}-py3.12-
      # Regenerate the coverage badge into the docs tree so it ships in the Pages
      # site at /assets/coverage.svg (the URL the README badge points at). No
      # commit-back, no third-party service — the SVG is rebuilt on every deploy.
      - name: coverage badge
        run: |
          uv run --no-sync pytest -m "not rxinfer" -n auto --dist worksteal \
            --cov=cpomdp --cov-report=xml -q
          uvx --from "genbadge[coverage]" genbadge coverage \
            -i coverage.xml -o docs/assets/coverage.svg
      - run: uv run --no-sync mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # first attempt that succeeds wins; the rest are skipped and have no output
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Settle before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Settle before final attempt
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (attempt 3)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
