# Version updates for the lock, the pre-commit hooks and the workflow actions (ADR-093).
# Each group takes every update in its ecosystem, majors included, so a run opens at most
# one pull request per ecosystem (ADR-094). A group that names `update-types` admits only
# versions the ecosystem's version class parses, and that left the hook updates out of
# `hooks`.
# Security updates are a repository setting, and they open as advisories are published
# rather than on this schedule.
#
# RxInfer is out of reach here. CI pins it in `ci.yml` and the backend declares its range
# in `src/cpomdp/juliapkg.json`. Both move by hand, because the oracle's numbers move only
# when the pin does (ADR-085).
version: 2

updates:
  # `lockfile-only`, because for a library Dependabot's default widens the ranges in
  # `pyproject.toml`. Those ranges are the published `Requires-Dist`, so moving one is a
  # release decision.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    versioning-strategy: lockfile-only
    cooldown:
      default-days: 7
    groups:
      lock:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  # ruff has no entry here. Its hook runs the locked ruff, so the `uv` entry moves it.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      hooks:
        patterns: ["*"]
    commit-message:
      prefix: chore

  # `publish.yml` runs only on a release and `docs.yml` deploys only from main, so no pull
  # request runs the actions they use. The dependency review reads a change to them before
  # it merges, and fails for a review by hand when the change moves `claude-review.yml`.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
