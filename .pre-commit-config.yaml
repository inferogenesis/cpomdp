# One-time setup after cloning (installs both the pre-commit and commit-msg hooks):
#   uv run pre-commit install --hook-type pre-commit --hook-type commit-msg
# The ruff and ty hooks mirror the CI `lint` job, so a clean commit here is a green CI.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep this in sync with the `ruff` pin in pyproject's dev group, so local
    # and CI agree on exactly which ruff is judging the code.
    rev: v0.15.16
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Strict type-checking, mirroring the CI `ty (strict types)` step exactly.
  # A local hook running the same `uv run ty check` keeps local and CI in lockstep
  # (the pinned ty version lives in pyproject's dev group, like ruff above).
  # `--extra examples` puts matplotlib and pillow in reach, since `examples/` is inside
  # the checked tree and its demos import them.
  - repo: local
    hooks:
      - id: ty
        name: ty (strict types)
        entry: uv run --extra examples ty check
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # mkdocs.yml names a Python function for the Mermaid fence, which a safe YAML
        # loader cannot construct. The strict docs build parses it instead.
        exclude: ^mkdocs\.yml$
      - id: check-toml
      - id: check-merge-conflict

  # Markdown linting. Rules and ignores live in `.markdownlint-cli2.yaml` so a
  # local run (`markdownlint-cli2`) and this hook judge the docs identically.
  # pre-commit provisions its own Node, so no global install is needed.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
        # Pinned so pre-commit fetches its own Node rather than using whatever the
        # machine has. Ubuntu 24.04 ships Node 18, which these hooks refuse to run on,
        # and the failure surfaces in CI instead of at the commit that caused it.
        language_version: "22.23.2"
        # The mkdocs single-source stubs aren't standalone documents (they're
        # `--8<--` includes of README.md / CHANGELOG.md / the example galleries),
        # so skip them.
        exclude: ^docs/(index|changelog|examples|examples-ffg)\.md$

  # Spell-check prose and docstrings. The dictionary and ignores live in
  # `cspell.json`, so the editor extension and these hooks agree. pre-commit
  # provisions its own Node. Two runs: markdown everywhere, plus the `src/`
  # Python (cspell splits snake_case into real words, so it mostly catches
  # docstring/comment typos — code identifiers are allow-listed in cspell.json).
  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.0.1
    hooks:
      - id: cspell
        # cspell-cli v10 needs Node >= 22.18. Same reasoning as markdownlint above.
        language_version: "22.23.2"
        name: cspell (markdown)
        types: [markdown]
        # The mkdocs single-source stubs are `--8<--` includes, not documents.
        exclude: ^docs/(index|changelog|examples|examples-ffg)\.md$
      - id: cspell
        language_version: "22.23.2"
        name: cspell (src docstrings)
        types: [python]
        files: ^(src|packages/warrantlib/src)/

  # The protected files (`PROTECTED_PATHS` in the script) are append-only: what a
  # reader gets from them is the ability to tell a claim made before a result from one
  # made after. Runs at commit-msg, the only stage that sees both the index and the
  # subject about to be recorded, and the subject is where `[in-place]` takes the typo
  # exception (ADR-054).
  - repo: local
    hooks:
      - id: protected-files
        name: protected files are append-only
        entry: uv run --no-sync python protected_files.py
        language: system
        stages: [commit-msg]

  # Enforce Conventional Commit messages (feat:, fix:, docs:, ...), matching the
  # style already used in the git history. Runs at the commit-msg stage.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
