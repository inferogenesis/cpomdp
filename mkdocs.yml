site_name: cpomdp
site_description: Continuous active inference for Python — the continuous-state sibling of pymdp.
site_url: https://cpomdp.inferogenesis.com/
repo_url: https://github.com/inferogenesis/cpomdp
repo_name: inferogenesis/cpomdp

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

# Pastes the `--8<--` includes (README, CHANGELOG, the two example galleries) into
# their stub pages and repoints the relative links in them, so one file reads
# correctly both on GitHub and here. See the module docstring.
hooks:
  - mkdocs_hooks.py

plugins:
  - search
  - bibtex:
      bib_file: docs/references.bib
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # The warrant vocabulary is re-exported from `warrantlib`, so griffe needs
          # that package's source to follow the alias behind `::: cpomdp.Warrant`.
          paths: [src, packages/warrantlib/src]
          options:
            docstring_style: google
            docstring_section_style: table
            show_root_heading: true
            show_root_full_path: false
            show_source: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true

nav:
  - Home: index.md
  - Step-by-step guide: guides/step-by-step.md
  - Examples:
      - Gallery: examples.md
      - FFG examples: examples-ffg.md
  - API reference:
      - Agent: api/agent.md
      - Model & belief: api/model.md
      - Observation models: api/observation.md
      - Process noise: api/dynamics.md
      - Model structure: api/structure.md
      - Backends: api/backends.md
      - Factor graph models: api/ffg.md
      - Action selection & goals: api/selection.md
      - Expected free energy: api/efe.md
      - Diagnostics: api/diagnostics.md
      - Warrant: api/warrant.md
      - Control (internal): api/control.md
  - References: references.md
  - Changelog: changelog.md
