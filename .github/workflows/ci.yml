name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      # `examples` extra: `ty` covers `examples/`, so matplotlib and pillow have to be
      # resolvable or every demo import reads as missing.
      - run: uv sync --locked --extra examples
      # Cache the pre-commit hook environments, keyed on the config.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # Run the same hooks contributors run locally (ruff lint + format + file
      # hygiene), so CI and pre-commit can never disagree. Fails if any hook would
      # change a file. The commit-msg hook isn't run here (no commit to check).
      - name: pre-commit
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure
      # `--no-sync`, or a bare `uv run` re-syncs the environment back to the
      # default set and takes matplotlib out again.
      - name: ty (strict types)
        run: uv run --no-sync ty check
      # The manifest is generated, so a layout the writer no longer emits is stale even
      # when every declared id is right. Asking that needs only the file, which is why
      # it sits here at 70ms rather than behind the suites that cost a quarter of an
      # hour to re-derive. Whether the ids themselves are current is the `symbolic`
      # job's business (ADR-055).
      - name: the manifest's layout is current
        run: >-
          uv run --no-sync python -m warrantlib.manifest --check --layout-only
          research/registered_checks.toml

  append-only:
    name: append-only (protected files)
    runs-on: ubuntu-latest
    steps:
      # Full history: the check compares the pull request against its merge base with
      # the base branch, and a shallow clone has the files without the graph to find
      # it in.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # `fetch-depth: 0` already brings the branch down on every event this workflow
      # runs on. Asking again costs nothing and takes the job's correctness off the
      # checkout action's defaults. The check refuses to pass rather than compare
      # nothing, so a fetch that stopped working would fail here loudly.
      - name: fetch the base branch
        run: |
          git fetch --no-tags origin \
            "+refs/heads/${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"
      # Standard library only, so there is no environment to build. With no message
      # file the check reads `[in-place]` from the subjects already on the branch, so
      # an exception the commit-msg hook allowed is not refused here for good
      # (ADR-054).
      - name: no landed line is rewritten
        run: python3 protected_files.py

  docs:
    name: docs build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --group docs
      # `--strict` fails on a mkdocstrings reference that resolves to nothing and on a
      # dead relative link in an `--8<--` include. `docs.yml` runs the same build, but
      # only on push to main, so without this job a page that moved is first checked by
      # the Pages deploy *after* the merge, with main already broken. No badge step and
      # no deploy here: this is the gate, not the publish.
      - run: uv run --no-sync mkdocs build --strict

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      JAX_COMPILATION_CACHE_DIR: ${{ github.workspace }}/.jax-cache
      JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS: "0"
    steps:
      # Full history: `tests/test_provenance_ordering.py` asks git whether each
      # registration ref is an ancestor of the ref that measured against it. A shallow
      # clone has the files and not the graph, so the whole module would skip, and a
      # test that always skips is a test that does not exist.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          # Without a per-version key the matrix shares one cache entry and only
          # the first job to save it ever populates it.
          cache-suffix: py${{ matrix.python-version }}
      - run: uv sync --locked
      # The run id keeps the key unique so every run saves what it compiled;
      # restore starts from the newest previous save. Entries are hash-validated
      # by jax, so a stale cache is a miss, never a wrong result.
      - name: jax compilation cache
        uses: actions/cache@v5
        with:
          path: .jax-cache
          key: jax-cache-${{ runner.os }}-py${{ matrix.python-version }}-${{ github.run_id }}
          restore-keys: jax-cache-${{ runner.os }}-py${{ matrix.python-version }}-
      # The pure-Python suite: no Julia installed, so this also proves the
      # rxinfer-marked tests deselect cleanly when the optional extra is absent.
      # `slow` (the exhaustive crossover enumeration) is deselected here to keep PR
      # feedback fast; it gates on merge-to-main (docs.yml) and release (publish.yml).
      # `warrantlib` is measured alongside cpomdp. Its lines are exercised by this
      # suite, so leaving it out of the denominator would drop a published package off
      # the gate rather than reflect anything about how well it is tested.
      - name: pytest + coverage gate
        run: >-
          uv run --no-sync pytest -m "not rxinfer and not slow"
          -n auto --dist worksteal
          --cov=cpomdp --cov=warrantlib
          --cov-report=term-missing --cov-fail-under=80

  scope:
    name: what this change reaches
    runs-on: ubuntu-latest
    outputs:
      derivation: ${{ steps.reach.outputs.derivation }}
    steps:
      # Full history: the answer is a diff against the merge base with `main`.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: fetch main
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      # Nothing under `research/src` imports cpomdp, and the suites read no data. Their
      # inputs are the research package, warrantlib and sympy, and the job that runs
      # them syncs `--locked`, so a sympy change can only arrive through `uv.lock`.
      # That makes this filter exhaustive rather than a guess (ADR-055).
      #
      # `conftest.py` and this workflow are in the filter because both reach the run.
      # Rootdir is the repository root, so the symbolic invocation loads the root
      # conftest, which edits `sys.path`, declares `pytest_plugins` and special-cases
      # `research/registered_checks.toml` nodeids by name. This file carries the job's
      # command, its interpreter pin and its action versions.
      #
      # `pyproject.toml` is deliberately not here. A dependency edit that does not reach
      # `uv.lock` fails `uv sync --locked` before anything else runs. Including it would
      # re-tax every PR that touches a ruff ignore, which is the cost this filter exists
      # to remove. `[tool.pytest.ini_options]` is the channel that leaves open, and
      # ADR-055 names it.
      - name: does this change reach the derivation
        id: reach
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "derivation=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          reaches='^(research/|packages/warrantlib/|uv\.lock$|conftest\.py$|\.github/workflows/ci\.yml$)'
          # `--no-renames`: with detection on, a file moved out of `research/` prints
          # only its destination, so the move that changed the suite set reads as a
          # change somewhere else entirely and the job sits out.
          changed=$(git diff --name-only --no-renames "$(git merge-base HEAD origin/main)")
          if echo "$changed" | grep -qE "$reaches"; then
            echo "derivation=true" >> "$GITHUB_OUTPUT"
          else
            echo "derivation=false" >> "$GITHUB_OUTPUT"
          fi

  symbolic:
    name: symbolic suites (c₂ gate)
    needs: scope
    if: needs.scope.outputs.derivation == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      # `cpomdp-research` is a workspace member in the default `dev` group, so a plain
      # sync installs it along with sympy and scipy. Nothing under `src/cpomdp` imports
      # either of those.
      - run: uv sync --locked
      # `ty` covers `research/src` and the ordinary pytest run still does not
      # (`testpaths = ["tests"]`), so without this job a check that imports cleanly but
      # no longer runs reaches main and is found by hand or not at all.
      #
      # The manifest is what makes that a failure rather than a shorter run. It declares
      # every check each suite is registered to report, warrantlib's pytest plugin turns
      # each one into an item, and a declared check that stops reporting fails by name.
      # This replaced three pinned count strings, which could say a suite got shorter and
      # could not say which check left, and which a different check arriving in place of
      # the one that went would have satisfied.
      #
      # `--warrant-detail` prints each check's own line, which is what the suites printed
      # when this job ran them directly. The outcome reaches the terminal without it and
      # the reason the check gives does not, so the job would otherwise have kept the
      # verdicts and lost the record.
      #
      # Both directions of the reconciliation happen here. A declared check that stops
      # reporting fails by name, and a check the suite reports that nobody declared
      # fails too. `manifest --check` used to ask the same two questions in a second
      # step, and paid a second full derivation of the sextic to do it (ADR-055).
      - name: symbolic suites, reconciled against the manifest
        run: uv run --no-sync pytest research/registered_checks.toml --warrant-detail

  oracle:
    name: rxinfer oracle (Julia)
    runs-on: ubuntu-latest
    env:
      # The backend declares RxInfer as the range 5.4 (ADR-085). CI pins one version
      # inside it, so the oracle's numbers move only when this line does.
      RXINFER_VERSION: "5.4.0"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --extra rxinfer
      # The first RxInferBackend has juliapkg provision Julia and RxInfer. Cache the
      # depot so only the first run with this pin pays the download and the build.
      - name: Cache Julia depot
        uses: actions/cache@v5
        with:
          path: ~/.julia
          key: julia-depot-${{ runner.os }}-rxinfer-${{ env.RXINFER_VERSION }}
          restore-keys: julia-depot-${{ runner.os }}-
      # An entry the environment already declares is its owner's, and the backend
      # leaves it alone, so this pin is the version the tests run against.
      - name: pin RxInfer
        run: >-
          uv run --no-sync python -c "import juliapkg;
          juliapkg.add('RxInfer', '86711068-29c9-4ff7-b620-ae75d7495b3d',
          version='=$RXINFER_VERSION')"
      - name: pytest (rxinfer only)
        run: uv run --no-sync pytest -m rxinfer
